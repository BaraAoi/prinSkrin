name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check project
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Show result
        run: Get-ChildItem release/*.exe | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prinSkrin-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish release assets (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${{ github.ref_name }}" release/*.exe --generate-notes --title "prinSkrin ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
